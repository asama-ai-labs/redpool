# Every commit in a pull request must carry a Signed-off-by line. See
# CONTRIBUTING.md, "Sign your commits (DCO)".

name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Signed-off-by
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check sign-off on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            author="$(git log -1 --format='%an' "$sha")"
            subject="$(git log -1 --format='%s' "$sha")"
            case "$author" in
              *"[bot]") continue ;;
            esac
            if git log -1 --format='%B' "$sha" |
              grep -Eq '^Signed-off-by: .+ <[^<>@ ]+@[^<>@ ]+>[[:space:]]*$'; then
              echo "ok      ${sha:0:10} ${subject}"
            else
              echo "::error::Commit ${sha:0:10} (${subject}) has no Signed-off-by line"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            {
              echo "### Missing Signed-off-by"
              echo
              echo "Sign off the last commit with \`git commit --amend -s\`, or every commit in the"
              echo "branch with \`git rebase --signoff ${BASE_SHA:0:10}\`, then force-push."
              echo "See CONTRIBUTING.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
